<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نظام التزويد</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icon-192.png" />
    <meta name="theme-color" content="#185fa5" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="root">جارٍ التحميل...</div>

    <!--
      شبكة أمان: أي خطأ برمجي (حتى لو فشل تحميل مكتبة من الإنترنت) هيظهر هنا
      مباشرة بالنص الأحمر تحت الصفحة، من غير ما تحتاج تفتح أدوات المطوّرين.
    -->
    <script>
      // الرسالة الواحدة بتتعرض مرة واحدة بس ومعاها عدّاد تكرار — قبل كده
      // كان الخطأ المتكرر بيملا الشاشة كلها ويخفي النظام تحته.
      var seenErrors = {};
      function showFatalError(msg) {
        var el = document.getElementById('fatal-error-box');
        if (!el) {
          el = document.createElement('div');
          el.id = 'fatal-error-box';
          el.style.cssText =
            'position:fixed;bottom:0;left:0;right:0;background:#fcebeb;color:#791f1f;' +
            'padding:12px;font-family:sans-serif;font-size:13px;direction:rtl;text-align:right;' +
            'z-index:9999;max-height:35vh;overflow:auto;border-top:3px solid #791f1f;';
          var close = document.createElement('button');
          close.textContent = '✕ إخفاء';
          close.style.cssText =
            'float:left;border:1px solid #791f1f;background:transparent;color:#791f1f;' +
            'border-radius:8px;padding:4px 10px;cursor:pointer;font-size:12px;';
          close.onclick = function () { el.remove(); };
          el.appendChild(close);
          document.body.appendChild(el);
        }

        var entry = seenErrors[msg];
        if (entry) {
          entry.count++;
          entry.node.textContent = 'خطأ (×' + entry.count + '): ' + msg;
          return;
        }

        // سقف أمان: لو ظهرت أنواع أخطاء كتير، منزوّدش أكتر من كده.
        if (Object.keys(seenErrors).length >= 8) return;

        var line = document.createElement('div');
        line.style.marginBottom = '6px';
        line.textContent = 'خطأ: ' + msg;
        el.appendChild(line);
        seenErrors[msg] = { count: 1, node: line };
      }
      window.addEventListener(
        'error',
        function (e) {
          var msg = e.message || 'تعذّر تحميل ملف: ' + (e.target && e.target.src ? e.target.src : '');
          showFatalError(msg + (e.filename ? ' — ' + e.filename + ':' + e.lineno : ''));
        },
        true
      );
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e.reason && e.reason.message ? e.reason.message : String(e.reason);
        showFatalError('Promise: ' + reason);
      });
    </script>

    <!-- Firebase (نسخة compat، سكريبت عادي بدون import/export) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <!--
      QZ Tray: بيسمح للنظام يشوف طابعاتك الحقيقية المتصلة بالجهاز ده
      ويطبع عليها مباشرة بمقاس دقيق، من غير المرور بنافذة طباعة المتصفح
      وقيود قايمة المقاسات المحفوظة في تعريف الطابعة. يحتاج تثبيت برنامج
      QZ Tray على الجهاز (خطوات في README قسم 2ب). لو غير متثبّت، النظام
      يرجع تلقائيًا لطريقة الطباعة العادية (نافذة المتصفح) من غير أي مشكلة.
    -->
    <script src="https://cdn.jsdelivr.net/npm/qz-tray@2.2.4/qz-tray.js"></script>

    <!-- jsrsasign: بتوقّع طلبات الطباعة لـ QZ Tray عشان الطباعة تبقى صامتة
         100% من غير مربّع "Allow / Block" في كل مرة. تفاصيل في
         js/qz-signing.js وفي README. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsrsasign/10.8.6/jsrsasign-all-min.js"></script>

    <!-- توليد QR: بيتحمّل في الصفحة الرئيسية (مش جوه صفحة الطباعة) عشان
         الكود يتولّد كصورة جاهزة قبل ما نبعتها للطابعة — ده بيمنع مشكلة
         "الطابعة طبعت قبل ما الـQR يظهر". -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!--
      qrcode-generator (Kazuhiko Arase) — المولّد الأساسي للـQR دلوقتي.
      جوه المستودع مش من سيرفر خارجي، عشان يشتغل من غير نت من أول لحظة.

      ليه اتضاف مع إن فيه مكتبة QR أصلًا؟ لأن القديمة (qrcodejs):
        • مابتعرفش الوضع الرقمي، فباركود 13 رقم كان بياخد ضعف المساحة
        • وبتختار نسخة أكبر من اللازم حتى في وضع الأحرف
      والنتيجة كانت مربعات 3.42 نقطة طباعة بدل 4.08 — وده اللي كان بيخلي
      ملصقات الأصناف صعبة القراءة، بينما ملصقات الفئات (رقم قصير) شغّالة.
      القديمة فضلت موجودة كاحتياطي بس.
    -->
    <script src="./js/vendor/qrcode-generator.js"></script>

    <!--
      jsQR — قارئ الـQR البديل.

      النظام بيقرا الباركود بـ BarcodeDetector المبنية جوه المتصفح، وهي
      الأسرع والأدق وبتقرا الباركود الخطي كمان. بس **سفاري على الأيفون
      مابيدعمهاش**، وكانت النتيجة إن زرار الكاميرا يختفي على الأيفون خالص.

      الملف ده هو البديل هناك. بيقرا QR بس — وده كفاية لأن كل الملصقات
      اللي النظام بيطبعها QR.
    -->
    <script src="./js/vendor/jsqr.js"></script>

    <!-- SheetJS: قراءة وكتابة ملفات الإكسل (الاستيراد والتصدير).
         الملف بيتقرا في المتصفح نفسه — مابيتبعتش لأي سيرفر خارجي. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- إعداداتنا ومنطقنا: كل الملفات دي JavaScript عادي 100%، مفيش JSX
         ومفيش أي أداة تحويل — بالظبط زي أي نظام HTML عادي. -->
    <script src="./firebase-config.js"></script>
    <script src="./js/app-info.js"></script>
    <script src="./js/local-store.js"></script>
    <script src="./js/permissions.js"></script>
    <script src="./js/qz-signing.js"></script>
    <script src="./js/barcode-scan.js"></script>
    <script src="./js/import-export.js"></script>
    <script src="./js/products.js"></script>
    <script src="./js/print-screen.js"></script>
    <script src="./js/user-admin.js"></script>
    <script src="./js/dashboard.js"></script>
    <script src="./js/app.js"></script>
    <script src="./js/update-prompt.js"></script>
  </body>
</html>
