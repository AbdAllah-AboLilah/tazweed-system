# رفع قواعد أمان Firestore تلقائيًا
# ============================================================
# الغرض: كل ما ملف firestore.rules يتغيّر ويترفع على main، القواعد تترفع
# لوحدها على Firebase — من غير ما تفتح Firebase Console خالص.
#
# ============================================================
# قرارات أمان مقصودة (متغيّرهاش من غير ما تفهم نتيجتها)
# ============================================================
#
# 1) `on: push` على main **بس**. مفيش `pull_request` ولا `pull_request_target`
#    نهائيًا. السبب: المستودع Public، يعني أي حد على النت يقدر يفتح Pull
#    Request. لو الملف ده اشتغل مع الـPull Requests، حد خبيث كان يقدر يبعت
#    PR فيه كود يسرق المفتاح. الرفع على main محتاج صلاحية كتابة على
#    المستودع — يعني صاحبه وبس.
#
# 2) `permissions: contents: read` — أقل صلاحية ممكنة للتوكن التلقائي.
#
# 3) المفتاح بيتنقل عن طريق `env:` مش مكتوب جوه أمر الـrun مباشرة، عشان
#    قيمته ما تتكتبش في السكريبت اللي بيتنفّذ.
#
# 4) مفيش أي أمر بيطبع المفتاح (لا echo ولا cat ولا set -x).
#
# 5) المفتاح نفسه المفروض يكون **محدود الصلاحية**: تعديل قواعد
#    tazweed-system وبس — مايقدرش يقرا بيانات ولا يمسح ولا يلمس أي مشروع
#    تاني. الخطوات في README قسم "رفع القواعد تلقائيًا".

name: رفع قواعد وفهارس Firestore

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - '.github/workflows/deploy-firestore-rules.yml'
  # زرار يدوي من تبويب Actions، لو حبيت ترفع القواعد من غير أي تعديل.
  workflow_dispatch:

permissions:
  contents: read

# لو اترفع تحديثين ورا بعض، الأحدث بس هو اللي يكمّل.
concurrency:
  group: firestore-rules
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل ملفات المستودع
        uses: actions/checkout@v4

      - name: تجهيز Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تثبيت Firebase CLI
        run: npm install -g firebase-tools@13

      - name: تجهيز مفتاح الدخول
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA_KEY" ]; then
            echo "::error::الـSecret اسمه FIREBASE_SERVICE_ACCOUNT مش موجود في إعدادات المستودع."
            echo "::error::ضيفه من: Settings ← Secrets and variables ← Actions ← New repository secret"
            exit 1
          fi
          printf '%s' "$SA_KEY" > "$RUNNER_TEMP/sa.json"
          chmod 600 "$RUNNER_TEMP/sa.json"

      - name: رفع القواعد على Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          firebase deploy \
            --only firestore:rules \
            --project tazweed-system \
            --non-interactive

      # ------------------------------------------------------------
      # الفهارس (indexes) — خطوة مستقلة عن القواعد عن قصد
      # ------------------------------------------------------------
      # ليه مستقلة؟ لأن رفع الفهارس محتاج صلاحية **زيادة** على رفع القواعد
      # (Cloud Datastore Index Admin). مفتاح الخدمة اللي اتعمل للقواعد بس
      # مش هينفع هنا، والرفع هيفشل بخطأ صلاحيات.
      #
      # لو الخطوة دي فشلت، القواعد تكون اترفعت خلاص (وهي الأهم أمنيًا)،
      # والرسالة تحت بتقول بالظبط إيه المطلوب — بدل ما الشغل كله يفشل.
      #
      # ⚠️ الفهارس بتاخد دقايق عشان "تتبني" بعد الرفع. الاستعلامات بترجع
      # failed-precondition لحد ما البناء يخلص، وده طبيعي.
      - name: رفع الفهارس على Firebase
        id: indexes
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          firebase deploy \
            --only firestore:indexes \
            --project tazweed-system \
            --non-interactive

      - name: توضيح سبب فشل الفهارس (لو فشلت)
        if: steps.indexes.outcome == 'failure'
        run: |
          echo "::error::رفع الفهارس فشل. القواعد اترفعت تمام، الفهارس بس هي اللي وقفت."
          echo "::error::السبب المتوقع: مفتاح الخدمة FIREBASE_SERVICE_ACCOUNT مالوش صلاحية إنشاء فهارس."
          echo "::error::الحل: من Google Cloud Console ← IAM ← الحساب بتاع المفتاح ← ضيف الدور:"
          echo "::error::  Cloud Datastore Index Admin  (roles/datastore.indexAdmin)"
          echo "::error::وبعدها شغّل الـworkflow ده تاني من زرار Run workflow."
          echo "::error::بديل يدوي: Firebase Console ← Firestore ← Indexes ← Single field ← Add exemption"
          echo "::error::  للحقول: status و isBase و branchQty في مجموعة grades، بنطاق Collection group."
          exit 1

      - name: مسح المفتاح من الجهاز المؤقت
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
